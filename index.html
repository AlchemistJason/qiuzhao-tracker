<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027秋招内推 · 投递跟踪器</title>
<script>
/* 主题恢复提前执行：手动选择 > 系统偏好，避免 FOUC 闪烁 */
(function(){
  try {
    var t = localStorage.getItem("qiuzhao2027.theme");
    if (!t) {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.style.colorScheme = t;
  } catch(e) {}
})();
</script>
<script src="https://cdn.staticfile.org/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdn.staticfile.org/html5-qrcode/2.3.8/html5-qrcode.min.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="title-area">
      <h1>2027秋招内推 · 投递跟踪器</h1>
      <p class="subtitle">点击内推码复制 | 状态自动保存 | 数据版本 v<span id="dataVer"></span></p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="openSyncModal('export')" title="跨设备同步(二维码)" aria-label="跨设备同步">📱</button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题" aria-label="切换明暗主题">🌙</button>
      <button class="icon-btn" onclick="exportJSON()" title="导出备份" aria-label="导出备份">💾</button>
      <button class="icon-btn" onclick="document.getElementById('importInput').click()" title="导入备份" aria-label="导入备份">📥</button>
      <input type="file" id="importInput" accept=".json" onchange="importJSON(event)">
    </div>
  </div>

  <div class="dashboard" id="dashboard"></div>
  <div class="todo-bar hidden" id="todoBar"></div>
  <div class="weekly-bar hidden" id="weeklyBar"></div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索公司、岗位、地点、内推码..." aria-label="搜索公司、岗位、地点、内推码">
    </div>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-filter="all">全部<span class="count-badge" id="cAll"></span></button>
      <button class="filter-btn" data-filter="starred">⭐ 收藏<span class="count-badge" id="cStar"></span></button>
      <button class="filter-btn" data-filter="pending">⏳ 未投递<span class="count-badge" id="cPending"></span></button>
      <button class="filter-btn" data-filter="active">🔄 进行中<span class="count-badge" id="cActive"></span></button>
      <button class="filter-btn" data-filter="done">✅ 已结束<span class="count-badge" id="cDone"></span></button>
      <span style="width:1px;background:var(--border);margin:0 4px;"></span>
      <div id="catFilters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="view-toggle">
      <button id="tableViewBtn" class="active" onclick="switchView('table')">📊 表格</button>
      <button id="cardViewBtn" onclick="switchView('card')">🗂️ 卡片</button>
      <button id="kanbanViewBtn" onclick="switchView('kanban')">📌 看板</button>
    </div>
  </div>

  <div class="table-wrapper" id="tableView">
    <table aria-label="2027届秋招企业信息与投递状态表">
      <thead>
        <tr>
          <th style="width:32px"></th>
          <th style="width:130px" data-sort="company">公司 <span class="sort-icon">⇅</span></th>
          <th style="width:90px" data-sort="type">类型 <span class="sort-icon">⇅</span></th>
          <th style="min-width:180px">招聘岗位</th>
          <th style="width:90px" data-sort="location">地点 <span class="sort-icon">⇅</span></th>
          <th style="width:70px" data-sort="deadline">截止 <span class="sort-icon">⇅</span></th>
          <th style="width:80px">内推码</th>
          <th style="width:55px">投递</th>
          <th style="width:95px" data-sort="status">状态 <span class="sort-icon">⇅</span></th>
          <th style="width:110px">个人备注</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="no-results" id="noResults" style="display:none"><p>没有找到匹配的企业 😕</p></div>
  </div>

  <div class="card-grid hidden" id="cardView"></div>

  <!-- 看板视图 -->
  <div class="kanban hidden" id="kanbanView"></div>

  <footer>
    <p>📋 全量秋招个人内推文档（含笔试题库、就业资料包）：
      <a href="https://docs.qq.com/smartsheet/DTEhaVEpHaUJzTGRh" target="_blank">腾讯文档在线表格</a>
    </p>
    <p style="margin-top:4px;font-size:11px">
      状态保存在浏览器本地，各设备/用户互不影响 | 跨设备用 📱 二维码同步 |
      数据更新由维护方自动完成，不会影响你的状态
    </p>
    <div class="footer-actions">
      <button class="footer-btn" onclick="exportCSV()">📥 导出 CSV</button>
      <button class="footer-btn" onclick="exportJSON()">💾 备份(JSON)</button>
      <button class="footer-btn" onclick="resetData()" style="border-color:var(--red);color:var(--red)">🗑️ 重置状态</button>
    </div>
  </footer>
</div>

<!-- 同步弹窗 -->
<div id="syncModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="跨设备状态同步" onclick="if(event.target===this)closeSyncModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeSyncModal()" aria-label="关闭弹窗">✕</button>
    <h3 id="syncTitle">📱 跨设备同步</h3>
    <div id="syncBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
